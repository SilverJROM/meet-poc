<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>meet-poc</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="boot" class="boot"><span class="spinner"></span></div>

  <section id="login-panel" class="panel auth" hidden>
    <div class="card">
      <h1>meet-poc</h1>
      <p class="hint">Sign in to create meeting rooms.</p>
      <form id="login-form" autocomplete="on">
        <label>Email <input type="email" id="login-email" required autocomplete="username" /></label>
        <label>Password
          <div class="input-with-toggle">
            <input type="password" id="login-password" required autocomplete="current-password" />
            <button type="button" id="login-password-toggle" class="eye-btn" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </label>
        <button type="submit" class="primary">Sign in</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>
  </section>

  <section id="dashboard-panel" class="panel" hidden>
    <header class="topbar">
      <span class="brand">meet-poc</span>
      <span class="spacer"></span>
      <span class="user-email" id="user-email"></span>
      <button id="logout-btn" class="ghost">Logout</button>
    </header>
    <main class="dashboard">
      <section class="card create-room">
        <h2>Create a room</h2>
        <form id="create-room-form">
          <label>Room name <input type="text" id="room-title" placeholder="Team sync" maxlength="100" /></label>
          <button type="submit" class="primary">Create room</button>
        </form>
      </section>
      <section class="card room-list">
        <h2>Your rooms</h2>
        <ul id="rooms"></ul>
      </section>
    </main>
  </section>

  <section id="lobby-panel" class="panel auth" hidden>
    <div class="card">
      <h1 id="lobby-room-title">Joining…</h1>
      <p class="hint" id="lobby-hint">Enter your name to join.</p>
      <form id="lobby-form">
        <label>Your name <input type="text" id="lobby-name" required maxlength="64" autocomplete="name" /></label>
        <label class="checkbox"><input type="checkbox" id="cam-on" /> Start with camera on</label>
        <button type="submit" id="lobby-join-btn" class="primary">Ask to join</button>
        <div id="lobby-error" class="error"></div>
      </form>
      <div id="knocking-state" hidden>
        <p class="hint"><span class="spinner inline"></span> Asking the host to admit you…</p>
        <button type="button" id="cancel-knock-btn" class="ghost">Cancel</button>
      </div>
    </div>
  </section>

  <section id="call-panel" class="panel call" hidden>
    <header class="controls">
      <span class="room-label">Room: <strong id="room-label"></strong></span>
      <button id="mic-btn">Mute</button>
      <button id="cam-btn">Camera on</button>
      <button id="screen-btn">Share screen</button>
      <button id="rec-btn">Record</button>
      <span id="rec-indicator" hidden>● REC</span>
      <button id="leave-btn" class="danger">Leave</button>
    </header>
    <aside id="waiting-room" class="waiting-room" hidden>
      <div class="waiting-header">Waiting to join (<span id="waiting-count">0</span>)</div>
      <ul id="waiting-list"></ul>
    </aside>
    <main id="tiles" class="tiles"></main>
    <footer class="status" id="status"></footer>
  </section>

  <script src="/client.js"></script>
</body>
</html>
