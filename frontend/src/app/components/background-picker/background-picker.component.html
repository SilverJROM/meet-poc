@if (presentation() === 'overlay') {
  <button type="button" class="picker-backdrop" aria-label="Close background picker" (click)="requestClose()"></button>
}

<section class="picker-panel" aria-label="Background picker" (click)="$event.stopPropagation()">
  <header class="picker-header">
    <h2>Background</h2>
    @if (presentation() === 'overlay') {
      <button type="button" class="close-btn" aria-label="Close background picker" (click)="requestClose()">x</button>
    }
  </header>

  <div class="picker-grid" role="radiogroup" aria-label="Camera background">
    @for (option of options; track option.id; let index = $index) {
      <button
        type="button"
        class="background-tile"
        role="radio"
        [class.selected]="selectedId() === option.id"
        [class.loading]="busyId() === option.id"
        [attr.aria-checked]="selectedId() === option.id"
        (click)="select(option)"
        (keydown)="onTileKeydown($event, index)"
      >
        <span
          class="thumbnail"
          [class.none-thumb]="option.id === 'none'"
          [class.blur-thumb]="option.id === 'blur'"
          aria-hidden="true"
        >
          @if (option.assetUrl) {
            <img [src]="option.assetUrl" alt="">
          }
          @if (option.id === 'none') {
            <span class="none-mark"></span>
          }
        </span>
        <span class="tile-label">{{ option.label }}</span>
      </button>
    }
  </div>
</section>
