@if (presentation() === 'overlay') {
  <button type="button" class="picker-backdrop" aria-label="Close background picker" (click)="requestClose()"></button>
}

<section class="picker-panel" aria-label="Background picker" (click)="$event.stopPropagation()">
  <header class="picker-header">
    <h2>Background</h2>
    @if (presentation() === 'overlay') {
      <button type="button" class="close-btn" aria-label="Close background picker" (click)="requestClose()">x</button>
    }
  </header>

  <input #fileInput class="file-input" type="file" accept="image/*" (change)="onFileSelected($event)">

  <div class="picker-grid" role="radiogroup" aria-label="Camera background">
    @for (option of options; track option.id; let index = $index) {
      <button
        type="button"
        class="background-tile"
        role="radio"
        [class.selected]="selectedId() === option.id"
        [class.loading]="busyId() === option.id"
        [attr.aria-checked]="selectedId() === option.id"
        (click)="select(option)"
        (keydown)="onTileKeydown($event, index)"
      >
        <span
          class="thumbnail"
          [class.none-thumb]="option.id === 'none'"
          [class.blur-thumb]="option.id === 'blur'"
          aria-hidden="true"
        >
          @if (option.assetUrl) {
            <img [src]="option.assetUrl" alt="">
          }
          @if (option.id === 'none') {
            <span class="none-mark"></span>
          }
        </span>
        <span class="tile-label">{{ option.label }}</span>
      </button>
    }

    @for (custom of customs(); track custom.id; let customIndex = $index) {
      <span class="custom-tile">
        <button
          type="button"
          class="background-tile custom-background-tile"
          role="radio"
          [class.selected]="selectedId() === custom.id"
          [class.loading]="busyId() === custom.id"
          [attr.aria-checked]="selectedId() === custom.id"
          (click)="select(custom)"
          (keydown)="onTileKeydown($event, options.length + customIndex)"
        >
          <span class="thumbnail" aria-hidden="true">
            <img [src]="custom.assetUrl" alt="">
          </span>
          <span class="tile-label">{{ custom.label }}</span>
        </button>
        <button
          type="button"
          class="delete-custom"
          [attr.aria-label]="'Delete ' + custom.label"
          (click)="deleteCustom($event, custom)"
        >
          x
        </button>
      </span>
    }

    <button
      type="button"
      class="background-tile upload-tile"
      [class.loading]="uploadBusy()"
      [disabled]="uploadBusy()"
      (click)="requestUpload()"
      (keydown)="onTileKeydown($event, options.length + customs().length)"
    >
      <span class="thumbnail upload-thumb" aria-hidden="true">
        <span class="upload-plus">+</span>
      </span>
      <span class="tile-label">Upload custom</span>
    </button>
  </div>

  @if (uploadError()) {
    <p class="upload-error" role="alert">{{ uploadError() }}</p>
  }
</section>
