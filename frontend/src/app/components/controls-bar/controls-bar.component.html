<header class="controls-bar">
  <div class="room-label">{{ roomLabel() }}</div>
  <div class="controls">
    <button
      type="button"
      class="control-btn"
      [class.is-off]="!micOn()"
      [attr.aria-pressed]="micOn()"
      [attr.aria-label]="micOn() ? 'Mute microphone' : 'Unmute microphone'"
      (click)="mute.emit()"
      [title]="micOn() ? 'Mute microphone' : 'Unmute microphone'"
    >
      <ion-icon [name]="micOn() ? 'mic-outline' : 'mic-off-outline'"></ion-icon>
    </button>
    <button
      type="button"
      class="control-btn"
      [class.is-off]="!cameraOn()"
      [attr.aria-pressed]="cameraOn()"
      [attr.aria-label]="cameraOn() ? 'Turn camera off' : 'Turn camera on'"
      (click)="camera.emit()"
      [title]="cameraOn() ? 'Turn camera off' : 'Turn camera on'"
    >
      <ion-icon [name]="cameraOn() ? 'videocam-outline' : 'videocam-off-outline'"></ion-icon>
    </button>
    <button
      type="button"
      class="control-btn"
      [class.active]="screenOn()"
      [attr.aria-pressed]="screenOn()"
      [attr.aria-label]="screenOn() ? 'Stop sharing screen' : 'Share screen'"
      (click)="screen.emit()"
      [title]="screenOn() ? 'Stop sharing screen' : 'Share screen'"
    >
      <ion-icon name="desktop-outline"></ion-icon>
    </button>
    @if (isHost()) {
      <button
        type="button"
        class="control-btn"
        [class.recording]="recording()"
        [disabled]="uploading()"
        [attr.aria-pressed]="recording()"
        [attr.aria-label]="recording() ? 'Stop recording' : 'Record'"
        (click)="record.emit()"
        [title]="recording() ? 'Stop recording' : 'Record'"
      >
        <ion-icon [name]="recording() ? 'ellipse' : 'ellipse-outline'"></ion-icon>
      </button>
    }
    <button
      type="button"
      class="control-btn participant-toggle"
      [class.active]="sidebarOpen()"
      [class.has-waiting]="waitingCount() > 0"
      [attr.aria-pressed]="sidebarOpen()"
      [attr.aria-label]="sidebarOpen() ? 'Hide participants' : 'Show participants'"
      (click)="sidebar.emit()"
      [title]="sidebarOpen() ? 'Hide participants' : 'Show participants'"
    >
      <ion-icon name="people-outline"></ion-icon>
      <span class="count-badge">{{ participantCount() }}</span>
      @if (waitingCount() > 0) {
        <span class="waiting-badge">{{ waitingCount() }}</span>
      }
    </button>
    <button type="button" class="leave-btn" (click)="leave.emit()" aria-label="Leave call" title="Leave call">
      <ion-icon name="call-outline"></ion-icon>
    </button>
  </div>
</header>
