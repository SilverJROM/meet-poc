<div class="controls-bar" aria-label="Call controls">
  <div class="meeting-corner meeting-corner-left">
    <span class="room-label" [attr.title]="roomLabel()">{{ roomLabel() }}</span>
    <span class="meeting-aside">
      <span class="meeting-clock" aria-label="Meeting elapsed time">{{ elapsedLabel() }}</span>
      @if (connectionQualityLabel()) {
        <span
          class="connection-quality-dot"
          role="img"
          [attr.data-tone]="connectionQualityTone()"
          [attr.title]="connectionQualityTitle() || connectionQualityLabel()"
          [attr.aria-label]="'Connection: ' + (connectionQualityTitle() || connectionQualityLabel())"
        ></span>
      }
    </span>
  </div>

  <div class="meeting-corner meeting-corner-right" aria-label="Meeting tools">
    <button
      type="button"
      class="corner-btn chat-toggle"
      [class.active]="chatOpen()"
      [class.has-unread]="chatUnreadCount() > 0"
      [attr.aria-pressed]="chatOpen()"
      [attr.aria-label]="chatOpen() ? 'Hide chat' : 'Show chat'"
      (click)="chat.emit()"
      [title]="chatOpen() ? 'Hide chat' : 'Show chat'"
    >
      <ion-icon name="chatbox-outline"></ion-icon>
      @if (chatUnreadCount() > 0) {
        <span class="chat-badge">{{ chatUnreadCount() }}</span>
      }
    </button>
    <button
      type="button"
      class="corner-btn participant-toggle"
      [class.active]="sidebarOpen()"
      [class.has-waiting]="waitingCount() > 0"
      [attr.aria-pressed]="sidebarOpen()"
      [attr.aria-label]="sidebarOpen() ? 'Hide participants' : 'Show participants'"
      (click)="sidebar.emit()"
      [title]="sidebarOpen() ? 'Hide participants' : 'Show participants'"
    >
      <ion-icon name="people-outline"></ion-icon>
      <span class="count-badge">{{ participantCount() }}</span>
      @if (waitingCount() > 0) {
        <span class="waiting-badge">{{ waitingCount() }}</span>
      }
    </button>
  </div>

  <!-- Floating pill: Mic · Camera · Screen · More · Leave -->
  <div class="controls-pill" aria-label="Primary call controls">
    <button
      type="button"
      class="control-btn"
      [class.is-off]="!micOn()"
      [class.is-connecting]="audioConnecting()"
      [attr.aria-pressed]="micOn()"
      [attr.aria-label]="audioConnecting() ? 'Microphone connecting…' : (micOn() ? 'Mute microphone' : 'Unmute microphone')"
      (click)="mute.emit()"
      [title]="audioConnecting() ? 'Audio connecting…' : (micOn() ? 'Mute microphone' : 'Unmute microphone')"
    >
      @if (audioConnecting()) {
        <ion-icon name="chevron-up-outline" class="connecting-spinner"></ion-icon>
      } @else {
        <ion-icon [name]="micOn() ? 'mic-outline' : 'mic-off-outline'"></ion-icon>
      }
    </button>

    <button
      type="button"
      class="control-btn"
      [class.is-off]="!cameraOn()"
      [attr.aria-pressed]="cameraOn()"
      [attr.aria-label]="cameraOn() ? 'Turn camera off' : 'Turn camera on'"
      (click)="camera.emit()"
      [title]="cameraOn() ? 'Turn camera off' : 'Turn camera on'"
    >
      <ion-icon [name]="cameraOn() ? 'videocam-outline' : 'videocam-off-outline'"></ion-icon>
    </button>

    <button
      type="button"
      class="control-btn"
      [class.active]="screenOn()"
      [attr.aria-pressed]="screenOn()"
      [attr.aria-label]="screenOn() ? 'Stop sharing screen' : 'Share screen'"
      (click)="screen.emit()"
      [title]="screenOn() ? 'Stop sharing screen' : 'Share screen'"
    >
      <ion-icon name="desktop-outline"></ion-icon>
    </button>

    <div class="more-control">
      <button
        type="button"
        class="control-btn more-btn"
        [class.active]="moreOpen() || raiseHandOn() || recording()"
        [attr.aria-expanded]="moreOpen()"
        aria-label="More controls"
        title="More controls"
        (click)="toggleMore($event)"
      >
        <ion-icon name="ellipsis-horizontal"></ion-icon>
        @if (recording()) { <span class="rec-dot" aria-hidden="true"></span> }
      </button>

      @if (moreOpen()) {
        <div class="more-menu" role="menu" aria-label="More controls" (click)="$event.stopPropagation()">
          <div class="more-reactions" aria-label="Reactions">
            <button type="button" class="reaction-btn" [class.active]="raiseHandOn()" [attr.aria-pressed]="raiseHandOn()" (click)="chooseReaction('raise-hand')" [title]="raiseHandOn() ? 'Lower hand' : 'Raise hand'">✋</button>
            <button type="button" class="reaction-btn" aria-label="Thumbs up" (click)="chooseReaction('thumbs-up')">👍</button>
            <button type="button" class="reaction-btn" aria-label="Clap" (click)="chooseReaction('clap')">👏</button>
            <button type="button" class="reaction-btn" aria-label="Heart" (click)="chooseReaction('heart')">❤️</button>
          </div>

          <div class="more-divider"></div>

          @if (isHost()) {
            <button type="button" class="more-item" role="menuitem" [class.is-recording]="recording()" [disabled]="uploading()" (click)="chooseRecord()">
              <ion-icon [name]="recording() ? 'ellipse' : 'ellipse-outline'"></ion-icon>
              <span>{{ recording() ? 'Stop recording' : 'Record meeting' }}</span>
            </button>
          }

          <button type="button" class="more-item" role="menuitem" (click)="toggleSpeakerMuted()">
            <ion-icon [name]="remoteAudio.mutedAll() ? 'volume-mute-outline' : 'volume-high-outline'"></ion-icon>
            <span>{{ remoteAudio.mutedAll() ? 'Unmute speakers' : 'Mute speakers' }}</span>
          </button>
          <div class="more-volume">
            <input
              class="volume-slider"
              type="range"
              min="0"
              max="1"
              step="0.01"
              [value]="remoteAudio.volume()"
              aria-label="Speaker volume"
              (input)="setSpeakerVolume($event)"
            />
            <span class="volume-value">{{ volumeLabel() }}</span>
          </div>

          <div class="more-divider"></div>

          <button type="button" class="more-item" role="menuitem" (click)="chooseDeviceSettings()">
            <ion-icon name="settings-outline"></ion-icon>
            <span>Device settings</span>
          </button>
          <button type="button" class="more-item" role="menuitem" (click)="chooseBackgroundEffects()">
            <ion-icon name="color-wand-outline"></ion-icon>
            <span>Background effects</span>
          </button>
          <button type="button" class="more-item toggle" role="menuitemcheckbox" [attr.aria-checked]="equalSizeTiles()" (click)="toggleEqualSizeTiles()">
            <ion-icon name="grid-outline"></ion-icon>
            <span>Equal-size tiles</span>
            <span class="more-check" [class.checked]="equalSizeTiles()" aria-hidden="true"></span>
          </button>
        </div>
      }
    </div>

    <button type="button" class="control-btn leave-btn" (click)="leave.emit()" aria-label="Leave call" title="Leave call">
      <ion-icon name="call-outline"></ion-icon>
    </button>
  </div>
</div>
