<header class="controls-bar" aria-label="Call controls">
  <div class="meeting-corner meeting-corner-left">
    <span class="meeting-clock" aria-label="Meeting elapsed time">{{ elapsedLabel() }}</span>
    <span class="room-label">{{ roomLabel() }}</span>
  </div>

  <div class="controls" aria-label="Primary call controls">
    <div class="split-control" [class.is-off]="!micOn()">
      <button
        type="button"
        class="control-btn primary-toggle"
        [class.is-off]="!micOn()"
        [attr.aria-pressed]="micOn()"
        [attr.aria-label]="micOn() ? 'Mute microphone' : 'Unmute microphone'"
        (click)="mute.emit()"
        [title]="micOn() ? 'Mute microphone' : 'Unmute microphone'"
      >
        <ion-icon [name]="micOn() ? 'mic-outline' : 'mic-off-outline'"></ion-icon>
      </button>
      <button
        type="button"
        class="control-chevron"
        aria-label="Microphone device settings"
        title="Microphone device settings"
        (click)="devices.emit()"
      >
        <ion-icon name="chevron-up-outline"></ion-icon>
      </button>
    </div>

    <div class="split-control" [class.is-off]="!cameraOn()">
      <button
        type="button"
        class="control-btn primary-toggle"
        [class.is-off]="!cameraOn()"
        [attr.aria-pressed]="cameraOn()"
        [attr.aria-label]="cameraOn() ? 'Turn camera off' : 'Turn camera on'"
        (click)="camera.emit()"
        [title]="cameraOn() ? 'Turn camera off' : 'Turn camera on'"
      >
        <ion-icon [name]="cameraOn() ? 'videocam-outline' : 'videocam-off-outline'"></ion-icon>
      </button>
      <button
        type="button"
        class="control-chevron"
        aria-label="Camera device settings"
        title="Camera device settings"
        (click)="devices.emit()"
      >
        <ion-icon name="chevron-up-outline"></ion-icon>
      </button>
    </div>

    <button
      type="button"
      class="control-btn"
      [class.active]="screenOn()"
      [attr.aria-pressed]="screenOn()"
      [attr.aria-label]="screenOn() ? 'Stop sharing screen' : 'Share screen'"
      (click)="screen.emit()"
      [title]="screenOn() ? 'Stop sharing screen' : 'Share screen'"
    >
      <ion-icon name="desktop-outline"></ion-icon>
    </button>

    @if (isHost()) {
      <button
        type="button"
        class="control-btn"
        [class.recording]="recording()"
        [disabled]="uploading()"
        [attr.aria-pressed]="recording()"
        [attr.aria-label]="recording() ? 'Stop recording' : 'Record'"
        (click)="record.emit()"
        [title]="recording() ? 'Stop recording' : 'Record'"
      >
        <ion-icon [name]="recording() ? 'ellipse' : 'ellipse-outline'"></ion-icon>
      </button>
    }

    <button
      type="button"
      class="control-btn"
      aria-label="Device settings"
      (click)="devices.emit()"
      title="Device settings"
    >
      <ion-icon name="settings-outline"></ion-icon>
    </button>

    <div class="split-control speaker-control" [class.is-muted]="remoteAudio.mutedAll()">
      <button
        type="button"
        class="control-btn primary-toggle"
        [class.muted]="remoteAudio.mutedAll()"
        [attr.aria-pressed]="remoteAudio.mutedAll()"
        [attr.aria-label]="remoteAudio.mutedAll() ? 'Unmute meeting speakers' : 'Mute meeting speakers'"
        (click)="toggleSpeakerMuted()"
        [title]="remoteAudio.mutedAll() ? 'Unmute meeting speakers' : 'Mute meeting speakers'"
      >
        <ion-icon [name]="remoteAudio.mutedAll() ? 'volume-mute-outline' : 'volume-high-outline'"></ion-icon>
      </button>
      <button
        type="button"
        class="control-chevron"
        aria-label="Speaker volume"
        title="Speaker volume"
        [attr.aria-expanded]="volumePopoverOpen()"
        (click)="toggleVolumePopover($event)"
      >
        <ion-icon name="chevron-up-outline"></ion-icon>
      </button>
      @if (!micOn() && remoteAudio.mutedAll()) {
        <span class="combined-muted-indicator" aria-label="Microphone and speaker muted" title="Microphone and speaker muted"></span>
      }
      @if (volumePopoverOpen()) {
        <div class="volume-popover" role="dialog" aria-label="Speaker volume" (click)="$event.stopPropagation()">
          <span class="volume-value">{{ volumeLabel() }}</span>
          <div class="volume-slider-wrap">
            <span class="volume-normal-marker" aria-hidden="true"></span>
            <input
              class="volume-slider"
              type="range"
              min="0"
              max="1.3"
              step="0.01"
              [value]="remoteAudio.volume()"
              aria-label="Speaker volume"
              (input)="setSpeakerVolume($event)"
            />
          </div>
          <span class="volume-normal-label">100%</span>
        </div>
      }
    </div>

    <div class="reaction-control">
      <button
        type="button"
        class="control-btn"
        [class.active]="reactionsPopoverOpen() || raiseHandOn()"
        [attr.aria-expanded]="reactionsPopoverOpen()"
        aria-label="Reactions"
        title="Reactions"
        (click)="toggleReactionsPopover($event)"
      >
        <ion-icon name="happy-outline"></ion-icon>
      </button>
      @if (reactionsPopoverOpen()) {
        <div class="reactions-popover" role="dialog" aria-label="Reactions" (click)="$event.stopPropagation()">
          <button
            type="button"
            class="reaction-option"
            [class.active]="raiseHandOn()"
            [attr.aria-pressed]="raiseHandOn()"
            (click)="chooseReaction('raise-hand')"
          >
            <span aria-hidden="true">✋</span>
            <span>{{ raiseHandOn() ? 'Lower hand' : 'Raise hand' }}</span>
          </button>
          <button type="button" class="reaction-option reaction-emoji" aria-label="Thumbs up" (click)="chooseReaction('thumbs-up')">👍</button>
          <button type="button" class="reaction-option reaction-emoji" aria-label="Clap" (click)="chooseReaction('clap')">👏</button>
          <button type="button" class="reaction-option reaction-emoji" aria-label="Heart" (click)="chooseReaction('heart')">❤️</button>
        </div>
      }
    </div>

    <button type="button" class="leave-btn" (click)="leave.emit()" aria-label="Leave call" title="Leave call">
      <ion-icon name="call-outline"></ion-icon>
    </button>
  </div>

  <div class="meeting-corner meeting-corner-right" aria-label="Meeting tools">
    <button
      type="button"
      class="corner-btn chat-toggle"
      [class.active]="chatOpen()"
      [class.has-unread]="chatUnreadCount() > 0"
      [attr.aria-pressed]="chatOpen()"
      [attr.aria-label]="chatOpen() ? 'Hide chat' : 'Show chat'"
      (click)="chat.emit()"
      [title]="chatOpen() ? 'Hide chat' : 'Show chat'"
    >
      <ion-icon name="chatbox-outline"></ion-icon>
      @if (chatUnreadCount() > 0) {
        <span class="chat-badge">{{ chatUnreadCount() }}</span>
      }
    </button>
    <button
      type="button"
      class="corner-btn participant-toggle"
      [class.active]="sidebarOpen()"
      [class.has-waiting]="waitingCount() > 0"
      [attr.aria-pressed]="sidebarOpen()"
      [attr.aria-label]="sidebarOpen() ? 'Hide participants' : 'Show participants'"
      (click)="sidebar.emit()"
      [title]="sidebarOpen() ? 'Hide participants' : 'Show participants'"
    >
      <ion-icon name="people-outline"></ion-icon>
      <span class="count-badge">{{ participantCount() }}</span>
      @if (waitingCount() > 0) {
        <span class="waiting-badge">{{ waitingCount() }}</span>
      }
    </button>
  </div>
</header>
