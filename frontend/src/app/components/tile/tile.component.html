<article
  class="tile"
  [class.is-speaking]="speaking()"
  [class.strip-tile]="variant() === 'strip'"
  [class.share-main-tile]="variant() === 'share-main'"
  [attr.data-peer]="peer().id"
  [attr.data-state]="peer().connectionState"
  [attr.data-host]="peer().isHost"
  [attr.data-screen-on]="peer().screenOn"
>
  <div class="tile-content">
    @if (showVideo()) {
      <video #video autoplay playsinline [muted]="peer().isLocal"></video>
    } @else {
      <div class="camera-off-avatar" [style.background]="avatarColor()">
        <span>{{ initials() }}</span>
      </div>
    }

    <div class="tile-overlays">
      <div class="top-row">
        @if (peer().isHost) {
          <span class="host-badge">HOST</span>
        }
        @if (!peer().micEnabled) {
          <span class="mute-icon" aria-label="microphone muted">
            <ion-icon name="mic-off-outline"></ion-icon>
          </span>
        }
        @if (!peer().isLocal) {
          <span class="quality-pill" [attr.data-quality]="peer().audioOnlyReason ? 'audio-only' : peer().quality">
            {{ peer().audioOnlyReason ? 'audio only' : peer().quality }}
          </span>
        }
      </div>
      <div class="bottom-row">
        <span class="name-label">{{ peer().name }}</span>
        <span class="state">{{ peer().connectionState }}</span>
      </div>
    </div>
  </div>
</article>
