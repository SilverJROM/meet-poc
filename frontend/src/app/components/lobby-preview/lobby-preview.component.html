<section class="lobby-preview" [class.compact]="compact()" aria-label="Lobby device preview">
  <div class="preview-tile" [class.camera-off]="!videoEnabled()">
    @if (videoEnabled() && stream()?.getVideoTracks()?.length) {
      <video #video autoplay muted playsinline></video>
      @if (isMobile()) {
        <button
          type="button"
          class="flip-camera-btn"
          aria-label="Flip camera"
          [title]="facingMode() === 'user' ? 'Use rear camera' : 'Use front camera'"
          (click)="flipCamera.emit()"
        >
          <ion-icon name="camera-reverse-outline"></ion-icon>
        </button>
      }
    } @else {
      <div class="camera-placeholder">Camera off</div>
    }
  </div>

  @if (!compact()) {
    <div class="meter-row">
      <span>Mic level</span>
      @if (audioContextActivated()) {
        <app-mic-meter [level]="level()" />
      } @else {
        <button type="button" class="meter-activate" (click)="enableMicPreview.emit()">Tap to enable mic preview</button>
      }
    </div>

    <div class="device-grid">
      <label>
        <span>Microphone</span>
        <select class="device-select mic-select" [value]="selectedAudioId()" (change)="onAudioChange($event)">
          @for (device of audioInputs(); track device.deviceId) {
            <option [value]="device.deviceId">{{ device.label || 'Microphone' }}</option>
          }
        </select>
      </label>

      <label>
        <span>Camera</span>
        <select class="device-select camera-select" [value]="selectedVideoId()" (change)="onVideoChange($event)">
          @for (device of videoInputs(); track device.deviceId) {
            <option [value]="device.deviceId">{{ device.label || 'Camera' }}</option>
          }
        </select>
      </label>
    </div>
  }
</section>
