<div class="modal-backdrop">
  <div class="ended-toast" role="dialog" aria-modal="true" aria-labelledby="ended-title">
    <h2 id="ended-title">The host ended this meeting</h2>
    <p>You will be returned to your rooms in {{ countdown() }} seconds.</p>
    <button type="button" class="primary-btn" (click)="close()">OK</button>
  </div>
</div>
