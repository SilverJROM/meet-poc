<main class="app-shell" [class.is-collapsed]="collapsed()">
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="brand" routerLink="/app/rooms" title="VoiceLokal">
      <span class="brand-mark">V</span>
      <span class="brand-label">VoiceLokal</span>
    </a>

    <nav class="nav-list">
      @for (item of navItems(); track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [title]="collapsed() ? item.label : ''"
          [attr.aria-label]="item.label"
          ariaCurrentWhenActive="page"
        >
          <ion-icon [name]="item.icon"></ion-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <span class="sidebar-spacer"></span>

    <button
      type="button"
      class="collapse-btn"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <ion-icon [name]="collapsed() ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
      <span>{{ collapsed() ? 'Expand sidebar' : 'Collapse sidebar' }}</span>
    </button>
  </aside>

  <section class="app-main">
    <header class="app-topbar">
      <div class="topbar-title">
        <span>VoiceLokal</span>
        <h1>{{ pageTitle() }}</h1>
      </div>
      <span class="topbar-spacer"></span>
      <span class="user-email">{{ user()?.email }}</span>
      <button type="button" class="secondary-btn" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        Logout
      </button>
    </header>

    <div class="page-slot">
      <router-outlet></router-outlet>
    </div>
  </section>
</main>
