<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>B4 cam-off tile UI proof</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1115;
      font-family: system-ui, sans-serif;
    }

    .tile {
      position: relative;
      width: 480px;
      min-height: 220px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 18px;
      background: #1f2933;
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.34);
    }

    .tile-content,
    .camera-off-avatar {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .camera-off-avatar.has-bg-image {
      display: block;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .camera-off-avatar.has-bg-image::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.08) 42%, transparent 68%);
      pointer-events: none;
    }

    .initials-chip {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      min-width: 44px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      background: rgba(10, 12, 16, 0.72);
      backdrop-filter: blur(10px);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1;
      text-align: center;
    }

    .tile-overlays {
      position: absolute;
      inset: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .name-label {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 12, 16, 0.72);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
    }
  </style>
</head>
